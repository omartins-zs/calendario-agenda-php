services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calendario_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./docker/php/fpm-performance.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    environment:
      APP_URL: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sistema
      DB_USERNAME: usuario_docker
      DB_PASSWORD: senha_docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - calendario_network

  nginx:
    image: nginx:alpine
    container_name: calendario_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - calendario_network

  mysql:
    image: mysql:8.0
    container_name: calendario_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: sistema
      MYSQL_USER: usuario_docker
      MYSQL_PASSWORD: senha_docker
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - calendario_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: calendario_pma
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - calendario_network

volumes:
  mysql_data:
    driver: local

networks:
  calendario_network:
    driver: bridge
